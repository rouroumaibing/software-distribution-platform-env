# Harbor - bitnamicharts/harbor 27.0.3
# user: admin
# 口令策略（2026-10-20 决策）：不写死 adminPassword —— 留空时 chart 默认 adminPassword=""
# 由 bitnami common.secrets.passwords.manage 随机生成 22 位存 Secret（带 lookup 持久化，helm upgrade
# 不重置）；部署后从 Secret 取回（见 harbor-command-guide.txt「取回 admin 口令」）。harbor 为周边依赖，已解耦。
# 经 Envoy 网关（harbor-gateway）暴露为标准 443（https://harbor.sdpworkflow.com，无端口号）。
# 节点经 kind 网桥网关 IP + 宿主经 127.0.0.1 各自解析到宿主 443 发布的 harbor 网关；
# 与 kind.yaml 的 harbor mirror endpoint、三个 chart 的 imageAddr、build.sh 的 HARBOR_REGISTRY 三方一致（均不带端口）。
externalURL: https://harbor.sdpworkflow.com

exposureType: proxy
service:
  type: ClusterIP
nginx:
  tls:
    enabled: false         # TLS 在 Envoy Gateway 终止，nginx 用 HTTP(80)
  behindReverseProxy: true # 位于反向代理之后，保留 X-Forwarded-Proto，保证 docker login 的 token 地址为 https
  image:
    repository: bitnamilegacy/nginx

core:
  image:
    repository: bitnamilegacy/harbor-core
jobservice:
  image:
    repository: bitnamilegacy/harbor-jobservice
registry:
  server:
    image:
      repository: bitnamilegacy/harbor-registry
  controller:
    image:
      repository: bitnamilegacy/harbor-registryctl

persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      size: 50Gi

global:
  # 所有 harbor 子图镜像统一走 localhost:5000（kind-registry bootstrap 中转）；
  # 节点 containerd 配了 localhost:5000 mirror，从内网秒级拉取，不依赖节点出网。
  # 注意：image.repository 只写 bitnamilegacy/<name>（不带 localhost:5000 前缀），
  # 由 global.imageRegistry 统一拼成 bitnamilegacy/<name>，否则 chart 会补默认
  # docker.io 前缀导致镜像名非法（InvalidImageName）。
  imageRegistry: localhost:5000
  security:
    allowInsecureImages: true
portal:
  image:
    repository: bitnamilegacy/harbor-portal
trivy:
  image:
    repository: bitnamilegacy/harbor-adapter-trivy
exporter:
  image:
    repository: bitnamilegacy/harbor-exporter
volumePermissions:
  image:
    repository: bitnamilegacy/os-shell
postgresql:
  image:
    repository: bitnamilegacy/postgresql
redis:
  image:
    repository: bitnamilegacy/redis
