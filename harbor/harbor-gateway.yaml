apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: harbor-gateway
  namespace: harbor
spec:
  gatewayClassName: sdp-eg        # 本集群实际的 GatewayClass（kubectl get gatewayclass 确认）
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: harbor.sdpworkflow.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: harbor.sdpworkflow.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: harbor-tls      # 手动创建的 TLS Secret，必须与 Gateway 在同一 namespace
      allowedRoutes:
        namespaces:
          from: Same
---
# HTTP -> HTTPS 跳转
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-http-redirect
  namespace: harbor
spec:
  parentRefs:
    - name: harbor-gateway
      sectionName: http
  hostnames:
    - harbor.sdpworkflow.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# 转发到 Harbor（Service 名称 harbor，端口 80）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  parentRefs:
    - name: harbor-gateway
      sectionName: https
  hostnames:
    - harbor.sdpworkflow.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 0s               # 不限制请求超时，避免大镜像层推送被中断
      backendRefs:
        - name: harbor
          port: 80
