# Hub 的 PostgreSQL（hub 仅支持 postgres driver）。
# 镜像地址含 __PG_IMAGE__ 占位符，由 deploy-without-harbor.sh 按 --registry 替换。
# PGDATA 指向挂载点子目录：CCE csi-disk 在挂载点根自动建 lost+found，
# 直接把 PGDATA 设为挂载根会让 initdb 因目录非空而拒绝启动。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: sdp-workflow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sdp-workflow
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Pod 创建时 K8s 会快照 SA 的 imagePullSecrets，之后改 SA 不影响存量 Pod；
      # 私有 registry 必须在这里显式声明拉取凭据，否则 anonymous 拉取 401。
      imagePullSecrets:
        - name: __PULL_SECRET__
      containers:
        - name: postgres
          image: __PG_IMAGE__
          env:
            - name: POSTGRES_USER
              value: sdp
            - name: POSTGRES_PASSWORD
              value: sdp
            - name: POSTGRES_DB
              value: sdp
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sdp", "-d", "sdp"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sdp-workflow
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
