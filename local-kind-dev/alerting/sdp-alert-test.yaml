# promtool test rules 用例（alerting-rules-design §2.3）。
# 跑法：promtool test rules sdp-alert-test.yaml（CI 可跑；本机无 promtool 时用
#   docker run --rm -v "$PWD":/w --workdir /w prom/prometheus:v3.4.1 promtool test rules sdp-alert-test.yaml）
# 覆盖：每条规则的「不触发 → 触发 →（for 类）恢复」完整生命周期。
rule_files:
  - sdp-alerts.yaml

evaluation_interval: 1m

tests:
  # ---- RunnerOffline：gauge 1→0 持续 2m fire，回 1 恢复 ----
  - interval: 1m
    input_series:
      - series: 'sdp_hub_gateway_connected_targets{target="local-dev"}'
        values: '1+0x3 0+0x5 1+0x4'
    alert_rule_test:
      - eval_time: 3m
        alertname: RunnerOffline
        exp_alerts: []
      - eval_time: 6m
        alertname: RunnerOffline
        exp_alerts:
          - exp_labels:
              severity: critical
              target: local-dev
            exp_annotations:
              summary: "Runner 离线：target local-dev 的 WS 连接已断开超过 2 分钟"
              runbook: "检查 target 侧 runner 进程/网络；若为计划内停机，忽略本次告警。hub 视角：GET /api/v1/targets 看 lastHeartbeatAt。"
      - eval_time: 12m
        alertname: RunnerOffline
        exp_alerts: []

  # ---- TargetDown：抓取 up=0 持续 3m fire ----
  - interval: 1m
    input_series:
      - series: 'up{job="sdp-runner", instance="runner-1:9100"}'
        values: '1+0x3 0+0x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 7m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: sdp-runner
              instance: runner-1:9100
            exp_annotations:
              summary: "Prometheus 抓取 runner 失败：runner-1:9100 持续 3 分钟不可达"
              runbook: "区分两种情况：runner 进程死（TargetDown 且 RunnerOffline 同时 fire）或仅 /metrics 端口异常。先 kubectl get pod 看 runner 状态。"

  # ---- RunnerFlapping：15m 窗口重连 >3 次 ----
  - interval: 1m
    input_series:
      - series: 'sdp_runner_connector_reconnects_total'
        values: '0+1x2 1+0x13 2+1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: RunnerFlapping
        exp_alerts: []
      - eval_time: 20m
        alertname: RunnerFlapping
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "runner 与 hub 的连接 15 分钟内重连超过 3 次（当前 4 次）"
              runbook: "检查 runner↔hub 网络路径（kind 环境:宿主代理/NAT 超时）；偶发 2-3 次可忽略。"

  # ---- PipelineFailBurst：10m 窗口 pipelinerun 失败 >3 次；taskrun 维度不触发 ----
  - interval: 1m
    input_series:
      - series: 'sdp_runner_alert_failures_total{kind="pipelinerun"}'
        values: '0+0x5 0+1x10'
      - series: 'sdp_runner_alert_failures_total{kind="taskrun"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 6m
        alertname: PipelineFailBurst
        exp_alerts: []
      - eval_time: 12m
        alertname: PipelineFailBurst
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: pipelinerun
            exp_annotations:
              summary: "10 分钟内流水线失败超过 3 次（当前 6 次）"
              runbook: "运行中心按 phase=Failed 过滤定位失败运行；常见为镜像拉取失败或构建脚本退出。"

  # ---- HubErrorSpike：5xx 占比 >5% 持续 5m fire；低流量比例 0 不触发 ----
  - interval: 1m
    input_series:
      - series: 'sdp_hub_http_requests_total{method="GET",status_class="2xx"}'
        values: '0+8x30'
      - series: 'sdp_hub_http_requests_total{method="POST",status_class="2xx"}'
        values: '0+2x30'
      - series: 'sdp_hub_http_requests_total{method="GET",status_class="5xx"}'
        values: '0+0x10 0+2x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: HubErrorSpike
        exp_alerts: []
      - eval_time: 25m
        alertname: HubErrorSpike
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "hub 5xx 占比超过 5% 持续 5 分钟（当前 16.67%）"
              runbook: "看 hub 日志 ERROR 段与最近发布；5xx 按路由分布查 GET /api/v1/audit-logs。"
