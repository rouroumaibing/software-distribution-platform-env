# 本地脚手架（归 local-kind-dev/deploy/，software-distribution-platform-env 仓，**不随三仓打包**）：kind 单节点集群定义。
# 三个项目仓独立于此 —— 集群/registry 都是本地测试基础设施。
# 端口暴露策略（与生产对齐：gateway/仓库均经域名访问）：
# - 两条网关数据面 svc 均为 NodePort（EG controller 实测接受 EnvoyProxy type: NodePort 并自动转换；
#   CRD 无法声明固定 nodePort 值，固定值由 deploy-local.sh 在 svc 创建后幂等 patch，EG 不回改）：
#     * sdp-gateway：https svc 8443 -> nodePort 31843；http svc 80 -> nodePort 31800
#     * harbor-gateway：https svc 443 -> nodePort 30443；http svc 80 -> nodePort 31810
# - 宿主可达统一走 extraPortMappings（docker-proxy 常驻，随集群存活，不依赖任何 pf 进程）：
#     host 8443 -> 节点 31843（浏览器/curl：--resolve www.sdpworkflow.com:8443:127.0.0.1）
#     host 8082 -> 节点 31800（网关 http listener）
#     host 443  -> 节点 30443（harbor：宿主 docker push / 浏览器；节点拉镜像不经宿主，
#                  集群内经 CoreDNS 把 harbor.sdpworkflow.com 解析到网关 ClusterIP 直达）
#   代价：改宿主端口须重建集群（重建由 images/ 离线缓存 + 幂等部署兜底，可接受）。
# - containerd mirror：
#   * localhost:5000 —— 仅作 bootstrap 中转（harbor 自身 bitnamilegacy 镜像、envoy 控制面/数据面镜像、
#     节点直拉 docker.io 被失效代理挡死，故这些"启动期依赖"经 kind docker 网络里的 kind-registry 中转）。
#   * harbor.sdpworkflow.com —— 平台服务镜像统一仓库（hub/runner/console/keycloak/postgres 全部推这里、从这儿拉），
#     走标准 443（mirror key/endpoint 均不带端口）。节点经集群 DNS（CoreDNS rewrite）把 harbor.sdpworkflow.com
#     解析到 harbor 网关 ClusterIP，在集群内直达 harbor（与生产"节点经 Gateway 域名拉镜像"一致），
#     不写任何 IP、不经宿主进程、无端口写死。
# 端口语义与同目录 gateway-sdp.yaml / env/harbor/harbor-gateway.yaml 的 EnvoyProxy 类型成对，改一处须同步另一处。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sdp-dev
nodes:
  - role: control-plane
    # node 镜像显式固定：kind 默认镜像随二进制版本漂移（v0.20 默认 v1.27.3，v0.29 默认 v1.33.1），
    # 不固定则换 kind 版本即触发出网拉取（本机出网不稳必卡死）。固定值与 images/ 离线缓存一致，
    # 本地 docker 有该镜像时 kind 直接用，零出网。
    image: kindest/node:v1.27.3
    # extraPortMappings 是 node 级字段（挂 nodes 条目下，非 Cluster 顶层——kind v0.29 顶层解码报 not found）。
    extraPortMappings:
      - containerPort: 31843
        hostPort: 8443
        protocol: TCP
      - containerPort: 31800
        hostPort: 8082
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://kind-registry:5000"]
  # 通用 docker.io 镜像（bootstrap 期依赖）：节点经 kind-registry:5000 中转，
  # 宿主把 registry:2 / envoyproxy/* / bitnamilegacy/* 等推到 localhost:5000 后节点即可拉。
  # 节点在 kind 网络内，直连 docker.io 实测极慢（envoy/quay.io 曾 6 分钟不完成）；
  # 故把 docker.io 镜像请求收口到 kind-registry:5000 中转（宿主侧已 pull 的镜像经内网秒级拉取）。
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
      endpoint = ["http://kind-registry:5000"]
  # harbor.sdpworkflow.com：平台镜像统一仓库，走标准 443（无端口）。
  # 节点 /etc/hosts 由 deploy-local.sh 在 harbor 网关 Programmed 后动态补 harbor.sdpworkflow.com -> 网关 ClusterIP，
  # 故 endpoint 用域名即可（443 默认 https）。mirror key 必须与 pod 镜像引用里的 host 完全一致
  # （harbor.sdpworkflow.com，无端口），否则节点拉取失败。
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."harbor.sdpworkflow.com"]
      endpoint = ["https://harbor.sdpworkflow.com"]
    [plugins."io.containerd.grpc.v1.cri".registry.configs."harbor.sdpworkflow.com".tls]
      insecure_skip_verify = true
    [plugins."io.containerd.grpc.v1.cri".registry.configs."harbor.sdpworkflow.com".auth]
      username = "admin"
      password = "Admin@123"
